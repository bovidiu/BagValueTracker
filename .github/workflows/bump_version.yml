# Creates the next semver tag on every merge to main.
# The pushed tag triggers release.yml, which packages and publishes the addon.
name: Bump version
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@v1 # Don't use @master or @v1 unless you're happy to test the latest version
        env:
          # Must be a Personal Access Token (repo scope), NOT the default
          # GITHUB_TOKEN - a tag pushed with GITHUB_TOKEN will not trigger release.yml.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          WITH_V: true
          # Bug-fix merges bump the patch digit; put "#minor" or "#major" in a
          # commit message on the merge to override.
          DEFAULT_BUMP: patch
